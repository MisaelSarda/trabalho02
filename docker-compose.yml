version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: db_doacoes
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data 
    networks:
      - doacoes_network

  
  app:
    build: .
    container_name: app_doacoes
    restart: always
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db 
      DB_PORT: 5432
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - doacoes_network

volumes:
  db_data:

networks:
  doacoes_network:
    driver: bridge